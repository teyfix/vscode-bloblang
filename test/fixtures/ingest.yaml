export:
  ingest/collection:
    input:
      label: redpanda
      redpanda:
        seed_brokers:
          - ${KAFKA_BROKERS}
        topics:
          - tmdb.normalized.collection
        consumer_group: tmdb.ingest.collection.v1
        start_from_oldest: true
        fetch_max_bytes: 2mb
        fetch_max_partition_bytes: 2mb
        fetch_max_wait: 5s
        max_yield_batch_bytes: 2mb
        partition_buffer_bytes: 2mb
      processors:
        - label: kafka_meta_collection
          mapping: |-
            meta tmdb_id = this.data.id
            meta tmdb_kind = "collection"
            meta tmdb_version = this.meta.ts

            root = this.assign({
            	"data": {
            		"version_ts": this.meta.ts
            	}
            })
    output:
      broker:
        outputs:
          - label: collection
            processors:
              - label: mapping_collection
                mapping: from "ingest/mapping/collection/collection.blobl"
              - label: dedup_meta_collection
                mapping: |-
                  root = this.assign({
                    "version_ts": this.version_ts.or(@tmdb_version)
                  })
              - label: dedup_group_collection
                group_by_value:
                  value: ${! json("id") }
              - label: dedup_archive_collection
                archive:
                  format: json_array
              - label: dedup_sort_collection
                mapping: root = this.sort_by(e -> e.version_ts).index(-1)
            sql_insert:
              driver: pgx
              dsn: ${POSTGRES_URL}
              table: '"${PG_SCHEMA}"."collection"'
              columns:
                - '"id"'
                - '"name"'
                - '"overview"'
                - '"poster_path"'
                - '"backdrop_path"'
                - '"original_name"'
                - '"original_language"'
                - '"version_ts"'
              args_mapping: |-
                root = [
                  this.id,
                  this.name,
                  this.overview,
                  this.poster_path,
                  this.backdrop_path,
                  this.original_name,
                  this.original_language,
                  this.version_ts,
                ]
              suffix: |-
                ON CONFLICT (
                  "id"
                )
                DO UPDATE SET
                  "id" = EXCLUDED."id",
                  "name" = EXCLUDED."name",
                  "overview" = EXCLUDED."overview",
                  "poster_path" = EXCLUDED."poster_path",
                  "backdrop_path" = EXCLUDED."backdrop_path",
                  "original_name" = EXCLUDED."original_name",
                  "original_language" = EXCLUDED."original_language",
                  "version_ts" = EXCLUDED."version_ts",
                  "updated_ts" = EXCLUDED."updated_ts"
              max_in_flight: ${INGEST_MAX_IN_FLIGHT}
              conn_max_open: ${INGEST_CONN_MAX_OPEN}
              conn_max_idle: ${INGEST_CONN_MAX_IDLE}
              conn_max_life_time: ${INGEST_CONN_MAX_LIFE_TIME}
          - label: collection_part
            processors:
              - label: mapping_collection_part
                mapping: from "ingest/mapping/collection/collection_part.blobl"
              - label: unarchive_collection_part
                unarchive:
                  format: json_array
              - label: dedup_meta_collection_part
                mapping: |-
                  root = this.assign({
                    "version_ts": this.version_ts.or(@tmdb_version)
                  })
              - label: dedup_group_collection_part
                group_by_value:
                  value: ${! json("collection_id") }:${! json("part_id") }
              - label: dedup_archive_collection_part
                archive:
                  format: json_array
              - label: dedup_sort_collection_part
                mapping: root = this.sort_by(e -> e.version_ts).index(-1)
            sql_insert:
              driver: pgx
              dsn: ${POSTGRES_URL}
              table: '"${PG_SCHEMA}"."collection_part"'
              columns:
                - '"collection_id"'
                - '"part_id"'
                - '"part_index"'
                - '"media_type"'
                - '"version_ts"'
              args_mapping: |-
                root = [
                  this.collection_id,
                  this.part_id,
                  this.part_index,
                  this.media_type,
                  this.version_ts,
                ]
              suffix: |-
                ON CONFLICT (
                  "collection_id",
                  "part_id"
                )
                DO UPDATE SET
                  "part_index" = EXCLUDED."part_index",
                  "media_type" = EXCLUDED."media_type",
                  "version_ts" = EXCLUDED."version_ts"
              max_in_flight: ${INGEST_MAX_IN_FLIGHT}
              conn_max_open: ${INGEST_CONN_MAX_OPEN}
              conn_max_idle: ${INGEST_CONN_MAX_IDLE}
              conn_max_life_time: ${INGEST_CONN_MAX_LIFE_TIME}
